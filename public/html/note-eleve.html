<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSmart — Mes matières</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="shortcut icon" href="/images/favicon.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/note-Eleve.css">
</head>

<body>

    <div id="toast" class="toast"></div>

    <div class="mise-en-page">

        <!-- ---------- SIDEBAR ---------- -->
        <aside class="sidebar" id="sidebar">
            <button class="bouton-fermer-sidebar" id="boutonFermerSidebar" aria-label="Fermer le menu">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="logo">
                <span class="logo-icone"><i class="fa-solid fa-graduation-cap"></i></span>
                <div class="logo-texte">
                    <span class="logo-nom">EduSmart</span>
                    <span class="logo-slogan">Espace étudiant</span>
                </div>
            </div>

            <nav class="nav-sidebar">
                <a href="/dashboard/eleve" class="nav-item">
                    <i class="fa-solid fa-table-cells"></i>
                    <span>Tableau de bord</span>
                </a>
                <a href="/dashboard/eleve/matiere" class="nav-item actif">
                    <i class="fa-solid fa-book"></i>
                    <span>Mes matières</span>
                    <span class="point-actif"></span>
                </a>
                <a href="/dashboard/eleve/emploi-du-temps" class="nav-item">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Emploi du temps</span>
                </a>
                <a href="/dashboard/eleve/infos" class="nav-item">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>Infos école</span>
                </a>
            </nav>

            <div class="nav-sidebar nav-sidebar-bas">
                <a href="/dashboard/eleve/parametre" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Paramètres</span>
                </a>
                <a href="/accueil" id="boutonDeconnexion" class="nav-item">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Déconnexion</span>
                </a>
            </div>
        </aside>

        <!-- ---------- CONTENU PRINCIPAL ---------- -->
        <div class="contenu-principal">

            <header class="barre-haut">
                <button class="bouton-burger" id="boutonBurger" aria-label="Ouvrir le menu">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div>
                    <h1>Mes notes</h1>
                    <p class="date-jour" id="dateJour"></p>
                </div>

                <div class="actions-haut">
                    <div class="profil">
                        <div class="profil-texte">
                            <span id="profilNom" class="profil-nom"></span>
                            <span id="profilRole" class="profil-role"></span>
                        </div>
                        <div id="profilAvatar" class="avatar"></div>
                    </div>
                </div>
            </header>

            <main class="zone-scroll">

                <section class="entete-page">
                    <div>
                        <h2>Mes notes par matière</h2>
                        <p>Sélectionnez une matière pour voir vos notes</p>
                    </div>
                </section>

                <section class="carte-panneau">
                    <div class="champ-formulaire" style="max-width: 300px;">
                        <label for="filtre_matiere">Matière</label>
                        <select id="filtre_matiere">
                            <option value="">Sélectionner une matière</option>
                        </select>
                    </div>
                </section>

                <section class="carte-panneau">
                    <div class="panneau-entete">
                        <div>
                            <h3>Détail des notes</h3>
                        </div>
                    </div>

                    <table class="tableau-eleves">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Note</th>
                            </tr>
                        </thead>
                        <tbody id="corpsTableauMesNotes">
                        </tbody>
                    </table>
                </section>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="/js/matiereEleve.js"></script>
</body>

</html>
