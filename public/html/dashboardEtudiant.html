<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSmart — Tableau de bord Élève</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="shortcut icon" href="/images/favicon.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="/css/dashboardEleve.css">
</head>

<body>

    <div id="toast" class="toast"></div>

    <div class="mise-en-page">

        <!-- ---------- SIDEBAR ---------- -->
        <aside class="sidebar" id="sidebar">
            <button class="bouton-fermer-sidebar" id="boutonFermerSidebar" aria-label="Fermer le menu">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="logo">
                <span class="logo-icone"><i class="fa-solid fa-graduation-cap"></i></span>
                <div class="logo-texte">
                    <span class="logo-nom">EduSmart</span>
                    <span class="logo-slogan">Espace étudiant</span>
                </div>
            </div>

            <nav class="nav-sidebar">
                <a href="/dashboard/etudiant" class="nav-item actif">
                    <i class="fa-solid fa-table-cells"></i>
                    <span>Tableau de bord</span>
                    <span class="point-actif"></span>
                </a>
                <a href="/dashboard/etudiant/mesNotes" class="nav-item">
                    <i class="fa-solid fa-book"></i>
                    <span>Mes notes</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-book"></i>
                    <span>Mes absences</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Emploi du temps</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>Infos école</span>
                </a>
            </nav>

            <div class="nav-sidebar nav-sidebar-bas">
                <a href="/dashboard/eleve/parametre" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Paramètres</span>
                </a>
                <a href="/accueil" id="boutonDeconnexion" class="nav-item">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Déconnexion</span>
                </a>
            </div>
        </aside>

        <!-- ---------- CONTENU PRINCIPAL ---------- -->
        <div class="contenu-principal">

            <!-- Barre du haut -->
            <header class="barre-haut">
                <button class="bouton-burger" id="boutonBurger" aria-label="Ouvrir le menu">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div>
                    <h1>Tableau de bord</h1>
                    <p class="date-jour" id="dateJour"></p>
                </div>

                <div class="actions-haut">
                    <div class="profil">
                        <div class="profil-texte">
                            <span id="profilNom" class="profil-nom"></span>
                            <span id="profilRole" class="profil-role"></span>
                        </div>
                        <div id="profilAvatar" class="avatar"></div>
                    </div>
                </div>
            </header>

            <main class="zone-scroll">

                <!-- Message de bienvenue -->
                <section class="bienvenue">
                    <div>
                        <h2 id="bienvenue-name"><span class="emoji-main"></span></h2>
                        <p>Bienvenue sur votre espace étudiant</p>
                    </div>
                </section>

                <!-- Cartes statistiques -->
                <section class="grille-stats-dash">
                    <div class="carte-stat-dash">
                        <div class="stat-entete">
                            <div class="icone-stat icone-indigo"><i class="fa-solid fa-star"></i></div>
                        </div>
                        <span class="stat-chiffre" id="statMoyenne"></span>
                        <span class="stat-titre">Moyenne générale</span>
                        <span class="stat-sous-titre" id="statMoyenneSous"></span>
                    </div>

                    <div class="carte-stat-dash">
                        <div class="stat-entete">
                            <div class="icone-stat icone-violet"><i class="fa-solid fa-ranking-star"></i></div>
                        </div>
                        <span class="stat-chiffre" id="statRang"></span>
                        <span class="stat-titre">Rang de classe</span>
                        <span class="stat-sous-titre" id="statRangSous"></span>
                    </div>

                    <div class="carte-stat-dash">
                        <div class="stat-entete">
                            <div class="icone-stat icone-bleu"><i class="fa-solid fa-book-open"></i></div>
                        </div>
                        <span class="stat-chiffre" id="statMatieres"></span>
                        <span class="stat-titre">Matières</span>
                        <span class="stat-sous-titre" id="statMatieresSous"></span>
                    </div>
                </section>

                <!-- Grille principale : contenu large -->
                <div class="grille-contenu">
                    <div class="colonne-large">
                        <!-- Détail des notes -->
                        <section class="carte-panneau">
                            <div class="panneau-entete">
                                <div>
                                    <h3>Détails</h3>
                                    <p>Liste des matières disponibles dans ta classe</p>
                                </div>
                            </div>

                            <table class="tableau-eleves">
                                <thead>
                                    <tr>
                                        <th>Matière</th>
                                        <th>professeur</th>
                                    </tr>
                                </thead>
                                <tbody id="corpsTableauNotes">
                                    <!-- Rempli par JS -->
                                </tbody>
                            </table>
                        </section>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="/js/dashboardEleve.js"></script>
</body>

</html>
